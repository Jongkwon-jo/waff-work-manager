[project]
name = "email-agent-service"
version = "0.1.0"
description = "Pydantic AI service for IMAP email work and schedule analysis."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "pydantic-ai>=0.0.55",
  "pydantic-settings>=2.4.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
